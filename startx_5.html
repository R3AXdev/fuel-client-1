<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StartX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── Reset & Root ─────────────────────────────────────────── */
:root {
  --green:    #05E57B;
  --green2:   #00B868;
  --bg-panel: rgba(18, 22, 34, 0.97);
  --bg-card:  rgba(41, 46, 61, 0.5);
  --border:   rgba(255,255,255,0.08);
  --border2:  rgba(255,255,255,0.13);
  --text:     #ffffff;
  --muted:    rgba(255,255,255,0.42);
  --muted2:   rgba(255,255,255,0.22);
  --radius:   14px;
  --blur:     20px;
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { width:100%; height:100%; overflow:hidden; font-family:'Outfit',sans-serif; color:var(--text); }
::selection { background:rgba(5,229,123,.3); }

/* ── Scrollbar ────────────────────────────────────────────── */
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,.15); border-radius:99px; }
::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.28); }

/* ── App Shell ────────────────────────────────────────────── */
#app { width:100vw; height:100vh; position:relative; overflow:hidden; }
#bg { position:absolute; inset:0; background:#060810; background-size:cover; background-position:center; transition:background .5s ease; z-index:0; }
#bg-overlay { position:absolute; inset:0; background:rgba(0,0,0,0); z-index:1; pointer-events:none; transition:background .5s; }

/* ── Topbar ───────────────────────────────────────────────── */
#topbar { position:fixed; top:16px; right:16px; z-index:50; }
#btn-settings {
  display:flex; align-items:center; gap:8px;
  background:rgba(18,22,34,.7); backdrop-filter:blur(var(--blur));
  border:1px solid var(--border2); border-radius:11px;
  padding:9px 16px; cursor:pointer;
  font-family:'Outfit',sans-serif; font-size:13px; font-weight:700;
  color:var(--muted); transition:all .2s; letter-spacing:-.1px;
}
#btn-settings:hover { background:rgba(18,22,34,.9); color:var(--text); border-color:rgba(255,255,255,.2); }
#btn-settings svg { flex-shrink:0; }

/* ── Settings Dropdown ────────────────────────────────────── */
#settings-menu {
  position:fixed; top:54px; right:16px;
  background:var(--bg-panel); backdrop-filter:blur(var(--blur));
  border:1px solid var(--border); border-radius:var(--radius);
  padding:5px; min-width:210px; z-index:200;
  box-shadow:0 16px 48px rgba(0,0,0,.55);
  display:none; animation:dropIn .18s ease;
}
#settings-menu.open { display:block; }
.mi {
  display:flex; align-items:center; gap:11px; padding:11px 13px;
  border-radius:10px; cursor:pointer; font-size:13px; font-weight:600;
  color:var(--muted); transition:all .15s; user-select:none;
}
.mi:hover { background:rgba(255,255,255,.06); color:var(--text); }
.mi .mi-ico { width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.mi-label { flex:1; }
.mi-sep { height:1px; background:var(--border); margin:4px 0; }

/* ── Center Stage ─────────────────────────────────────────── */
#stage { position:relative; z-index:2; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; padding:0 24px; }

/* ── Clock ────────────────────────────────────────────────── */
#clock { text-align:center; margin-bottom:6px; animation:fadeScale .8s ease both; }
#clock-time {
  font-size:clamp(72px,12vw,110px); font-weight:200; letter-spacing:-5px;
  line-height:1; font-variant-numeric:tabular-nums;
  text-shadow:0 4px 40px rgba(0,0,0,.5); color:var(--text);
}
#clock-ampm { font-size:clamp(20px,3vw,32px); font-weight:400; color:var(--muted); margin-left:6px; vertical-align:super; letter-spacing:0; }
#clock-date { font-size:clamp(13px,1.4vw,15px); font-weight:400; color:var(--muted); margin-top:10px; letter-spacing:.3px; }

/* ── Search ───────────────────────────────────────────────── */
#search-wrap { width:100%; max-width:540px; margin:30px 0 38px; animation:fadeUp .7s .12s ease both; }
#search-bar {
  display:flex; align-items:center; gap:13px;
  background:rgba(18,22,34,.6); backdrop-filter:blur(var(--blur));
  border:1px solid var(--border2); border-radius:99px; padding:15px 24px;
  box-shadow:0 8px 32px rgba(0,0,0,.3); transition:border-color .2s, box-shadow .2s;
}
#search-bar:focus-within { border-color:rgba(5,229,123,.3); box-shadow:0 8px 40px rgba(0,0,0,.4),0 0 0 3px rgba(5,229,123,.07); }
#search-input {
  background:transparent; border:none; outline:none; font-size:15px;
  color:var(--text); width:100%; font-family:'Outfit',sans-serif; font-weight:400;
}
#search-input::placeholder { color:var(--muted2); }
#search-btn { background:none; border:none; cursor:pointer; line-height:0; flex-shrink:0; opacity:0; transition:opacity .2s; }
#search-btn.show { opacity:1; }

/* ── Pinned Apps ──────────────────────────────────────────── */
#apps-grid { display:flex; flex-wrap:wrap; gap:22px; justify-content:center; align-items:flex-start; animation:fadeUp .7s .26s ease both; max-width:660px; }
.app-chip { display:flex; flex-direction:column; align-items:center; gap:9px; cursor:pointer; position:relative; }
.app-chip-box {
  width:68px; height:68px; border-radius:20px;
  background:var(--bg-card); backdrop-filter:blur(16px);
  border:1px solid var(--border2);
  display:flex; align-items:center; justify-content:center;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s;
  position:relative;
}
.app-chip:hover .app-chip-box { transform:scale(1.08); box-shadow:0 8px 28px rgba(0,0,0,.4); }
.app-chip:active .app-chip-box { transform:scale(.95); }
.app-chip-box img { width:36px; height:36px; border-radius:8px; object-fit:contain; }
.app-chip-init { font-size:26px; font-weight:700; }
.app-chip-label { font-size:11.5px; font-weight:500; color:rgba(255,255,255,.78); max-width:78px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; text-shadow:0 1px 6px rgba(0,0,0,.5); }
.chip-remove {
  position:absolute; top:-7px; right:-7px; width:20px; height:20px;
  border-radius:50%; background:rgba(0,0,0,.8); border:1.5px solid rgba(255,255,255,.18);
  display:flex; align-items:center; justify-content:center;
  font-size:9px; color:#fff; cursor:pointer; opacity:0; transition:opacity .15s; z-index:2;
}
.app-chip:hover .chip-remove { opacity:1; }
.app-more {
  display:flex; flex-direction:column; align-items:center; gap:9px; cursor:pointer;
}
.app-more-box {
  width:68px; height:68px; border-radius:20px;
  background:rgba(18,22,34,.45); backdrop-filter:blur(12px);
  border:1.5px dashed rgba(255,255,255,.18);
  display:flex; align-items:center; justify-content:center;
  transition:transform .18s ease, border-color .18s;
}
.app-more:hover .app-more-box { transform:scale(1.06); border-color:rgba(255,255,255,.32); }
.app-more-label { font-size:11.5px; font-weight:500; color:var(--muted2); }
#apps-empty { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:8px; }
#apps-empty kbd { background:rgba(41,46,61,.7); border:1px solid var(--border2); border-radius:7px; padding:2px 10px; font-family:'Outfit',sans-serif; font-size:12px; font-weight:700; backdrop-filter:blur(8px); }

/* ── Overlay ──────────────────────────────────────────────── */
#overlay { position:fixed; inset:0; z-index:89; background:transparent; pointer-events:none; transition:background .28s; }
#overlay.dim { background:rgba(0,0,0,.6); pointer-events:all; }

/* ── Apps Drawer ──────────────────────────────────────────── */
#drawer {
  position:fixed; top:0; right:0; bottom:0; width:370px;
  background:var(--bg-panel); backdrop-filter:blur(var(--blur));
  border-left:1px solid var(--border); z-index:90;
  transform:translateX(100%); transition:transform .3s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column;
}
#drawer.open { transform:translateX(0); }
.dh { padding:20px 18px 0; flex-shrink:0; }
.dh-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.dh-title { font-size:15px; font-weight:800; letter-spacing:-.3px; }
.d-search-wrap { position:relative; }
.d-search-ico { position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.28; pointer-events:none; }
.d-search { width:100%; background:rgba(255,255,255,.06); border:1px solid var(--border); border-radius:10px; padding:10px 14px 10px 36px; color:var(--text); font-size:13px; outline:none; font-family:'Outfit',sans-serif; transition:border-color .2s; }
.d-search:focus { border-color:rgba(5,229,123,.4); }
.d-search::placeholder { color:var(--muted2); }
.d-list { flex:1; overflow-y:auto; padding:6px 10px; }
.d-row { display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:10px; transition:background .15s; }
.d-row:hover { background:rgba(255,255,255,.05); }
.d-icon { width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,.06); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.d-icon img { width:22px; height:22px; border-radius:4px; object-fit:contain; }
.d-info { flex:1; min-width:0; }
.d-name { font-size:13px; font-weight:600; color:rgba(255,255,255,.88); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-decoration:none; display:block; transition:color .15s; }
.d-name:hover { color:var(--green); }
.d-domain { font-size:11px; color:var(--muted2); }
.d-pin { background:none; border:none; padding:6px; cursor:pointer; border-radius:6px; line-height:0; transition:background .15s; }
.d-pin:hover { background:rgba(255,255,255,.07); }
.d-del { background:none; border:none; padding:6px; cursor:pointer; border-radius:6px; line-height:0; color:rgba(248,113,113,.35); transition:all .15s; }
.d-del:hover { background:rgba(248,113,113,.1); color:#f87171; }
.d-footer { padding:14px 18px 18px; border-top:1px solid var(--border); flex-shrink:0; }
.d-add-btn { width:100%; padding:12px; border-radius:11px; background:rgba(255,255,255,.04); border:1.5px dashed rgba(255,255,255,.14); color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; font-family:'Outfit',sans-serif; display:flex; align-items:center; justify-content:center; gap:7px; transition:all .2s; }
.d-add-btn:hover { background:rgba(255,255,255,.08); color:var(--text); border-color:rgba(255,255,255,.28); }
.d-form { display:none; flex-direction:column; gap:8px; }
.f-input { background:rgba(255,255,255,.06); border:1px solid var(--border); border-radius:10px; padding:11px 14px; color:var(--text); font-size:13px; width:100%; outline:none; font-family:'Outfit',sans-serif; transition:border-color .2s; }
.f-input:focus { border-color:rgba(5,229,123,.45); }
.f-input::placeholder { color:var(--muted2); }
.f-row { display:flex; gap:8px; }
.btn-g { flex:1; padding:10px; border-radius:9px; background:linear-gradient(135deg,var(--green),var(--green2)); color:#020A04; font-size:13px; font-weight:800; border:none; cursor:pointer; font-family:'Outfit',sans-serif; letter-spacing:-.1px; transition:all .2s; }
.btn-g:hover { transform:translateY(-1px); box-shadow:0 5px 18px rgba(5,229,123,.28); }
.btn-c { flex:1; padding:10px; border-radius:9px; background:rgba(255,255,255,.05); border:1px solid var(--border); color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; font-family:'Outfit',sans-serif; transition:all .15s; }
.btn-c:hover { background:rgba(255,255,255,.09); color:var(--text); }

/* ── Colors Panel ─────────────────────────────────────────── */
#colors-panel {
  position:fixed; top:56px; right:16px;
  background:var(--bg-panel); backdrop-filter:blur(var(--blur));
  border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; z-index:200; width:268px;
  box-shadow:0 16px 50px rgba(0,0,0,.55);
  display:none; animation:dropIn .18s ease;
}
#colors-panel.open { display:block; }
.cp-title { font-size:13px; font-weight:800; letter-spacing:-.2px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
.sec { font-size:10px; font-weight:700; color:var(--muted2); letter-spacing:.9px; text-transform:uppercase; margin-bottom:8px; display:block; }
.color-row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.c-dot { width:30px; height:30px; border-radius:8px; cursor:pointer; border:2px solid transparent; transition:transform .15s, border-color .15s; flex-shrink:0; }
.c-dot:hover { transform:scale(1.12); }
.c-dot.on { border-color:var(--green)!important; box-shadow:0 0 0 2px rgba(5,229,123,.32); }
.grad-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.g-swatch { height:32px; border-radius:8px; cursor:pointer; border:2px solid transparent; transition:all .15s; }
.g-swatch:hover { transform:scale(1.04); }
.g-swatch.on { border-color:var(--green); box-shadow:0 0 0 2px rgba(5,229,123,.32); }
.custom-row { display:flex; align-items:center; gap:10px; margin-top:12px; }
.custom-swatch { width:30px; height:30px; border-radius:8px; border:2px solid rgba(255,255,255,.2); cursor:pointer; flex-shrink:0; overflow:hidden; position:relative; background:conic-gradient(red,yellow,lime,aqua,blue,magenta,red); }
.custom-swatch input[type=color] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
.custom-lbl { font-size:12px; color:var(--muted); font-weight:500; }

/* ── Wallpaper Panel ──────────────────────────────────────── */
#wp-panel {
  position:fixed; inset:0; z-index:150;
  background:rgba(10,13,22,.97); backdrop-filter:blur(24px);
  display:none; flex-direction:column; overflow:hidden;
}
#wp-panel.open { display:flex; animation:fadeIn .22s ease; }

/* WP Topbar */
#wp-bar {
  display:flex; align-items:center; justify-content:space-between;
  padding:0 24px; height:62px; border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.wp-brand { display:flex; align-items:center; gap:11px; }
.wp-brand-icon { width:30px; height:30px; background:linear-gradient(135deg,var(--green),var(--green2)); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:15px; }
.wp-brand-name { font-size:16px; font-weight:800; letter-spacing:-.4px; }
.wp-count-badge { font-size:11px; font-weight:700; color:var(--green); background:rgba(5,229,123,.1); border:1px solid rgba(5,229,123,.22); border-radius:5px; padding:2px 8px; letter-spacing:.4px; }
.wp-bar-right { display:flex; align-items:center; gap:10px; }
.wp-search-wrap { position:relative; }
#wp-search { background:rgba(255,255,255,.07); border:1px solid var(--border); border-radius:20px; padding:8px 14px 8px 34px; color:var(--text); font-size:13px; outline:none; font-family:'Outfit',sans-serif; width:190px; transition:border-color .2s, width .3s; }
#wp-search:focus { border-color:rgba(5,229,123,.4); width:220px; }
#wp-search::placeholder { color:var(--muted2); }
.wp-search-ico { position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.28; pointer-events:none; }

/* WP Filters Row */
#wp-filters {
  display:flex; align-items:center; gap:14px;
  padding:10px 24px; border-bottom:1px solid var(--border);
  flex-shrink:0; overflow:hidden;
}
.wp-filter-group { display:flex; background:rgba(255,255,255,.06); border-radius:20px; padding:3px; flex-shrink:0; gap:2px; }
.wp-f-btn { padding:5px 18px; border-radius:17px; font-size:12px; font-weight:700; cursor:pointer; font-family:'Outfit',sans-serif; border:none; color:var(--muted); background:transparent; transition:all .15s; letter-spacing:-.1px; }
.wp-f-btn.on { background:rgba(255,255,255,.13); color:var(--text); }
.wp-cats { display:flex; gap:6px; overflow-x:auto; flex:1; padding:0 2px; }
.wp-cats::-webkit-scrollbar { height:0; }
.wp-cat { padding:5px 14px; border-radius:99px; font-size:12px; font-weight:600; cursor:pointer; font-family:'Outfit',sans-serif; border:1px solid rgba(255,255,255,.1); color:var(--muted); background:transparent; transition:all .15s; white-space:nowrap; }
.wp-cat:hover { border-color:rgba(255,255,255,.24); color:rgba(255,255,255,.8); }
.wp-cat.on { background:rgba(5,229,123,.1); border-color:rgba(5,229,123,.45); color:var(--green); }

/* WP Grid */
#wp-scroll { flex:1; overflow-y:auto; }
#wp-grid {
  padding:18px 24px 14px;
  display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; align-content:start;
}
.wp-card {
  position:relative; cursor:pointer; border-radius:12px; overflow:hidden;
  border:2px solid transparent; aspect-ratio:16/10;
  background:linear-gradient(90deg,#111622,#181f30,#111622);
  background-size:200% 100%; animation:shimmer 1.8s infinite;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1), border-color .18s, box-shadow .18s;
}
.wp-card:hover { transform:scale(1.03); border-color:rgba(255,255,255,.3); box-shadow:0 10px 36px rgba(0,0,0,.5); }
.wp-card.sel { border-color:var(--green); box-shadow:0 0 0 3px rgba(5,229,123,.25); animation:none; }
.wp-card.loaded { animation:none; background:transparent; }
.wp-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .4s ease; }
.wp-img.vis { opacity:1; }
.wp-lbl { position:absolute; bottom:0; left:0; right:0; padding:20px 10px 8px; font-size:11.5px; font-weight:600; color:rgba(255,255,255,.92); text-align:center; background:linear-gradient(transparent,rgba(0,0,0,.7)); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none; }
.wp-hover { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.25); opacity:0; transition:opacity .2s; }
.wp-card:hover .wp-hover { opacity:1; }
.wp-use { background:var(--green); color:#020A04; font-size:12px; font-weight:800; padding:7px 18px; border-radius:99px; letter-spacing:.2px; transform:scale(.9); transition:transform .2s cubic-bezier(.34,1.56,.64,1); }
.wp-card:hover .wp-use { transform:scale(1); }
.wp-check { position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:50%; background:var(--green); display:flex; align-items:center; justify-content:center; font-size:13px; box-shadow:0 2px 8px rgba(0,0,0,.4); }
.wp-empty { grid-column:1/-1; text-align:center; padding:70px 20px; color:var(--muted); font-size:14px; display:flex; flex-direction:column; align-items:center; gap:10px; }

/* ── Icon Buttons ─────────────────────────────────────────── */
.ico-btn { background:transparent; border:none; padding:7px; border-radius:8px; cursor:pointer; line-height:0; color:var(--muted); transition:all .15s; }
.ico-btn:hover { background:rgba(255,255,255,.07); color:var(--text); }

/* ── Toast ────────────────────────────────────────────────── */
#toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:rgba(18,22,34,.98); border:1px solid var(--border2); border-radius:11px; padding:12px 22px; font-size:13px; font-weight:700; z-index:300; white-space:nowrap; box-shadow:0 10px 40px rgba(0,0,0,.55); display:none; animation:toastIn .25s ease; color:var(--green); pointer-events:none; }

/* ── Animations ───────────────────────────────────────────── */
@keyframes fadeIn    { from{opacity:0} to{opacity:1} }
@keyframes fadeScale { from{opacity:0;transform:scale(.96)} to{opacity:1;transform:none} }
@keyframes fadeUp    { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:none} }
@keyframes dropIn   { from{opacity:0;transform:translateY(-8px) scale(.97)} to{opacity:1;transform:none} }
@keyframes toastIn   { from{opacity:0;transform:translate(-50%,12px)} to{opacity:1;transform:translateX(-50%)} }
@keyframes shimmer   { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ── Pagination ───────────────────────────────────────────── */
#wp-pag {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 24px 20px; flex-shrink:0; border-top:1px solid var(--border);
  gap:12px; flex-wrap:wrap;
}
.pag-info { font-size:12px; color:var(--muted); font-weight:500; white-space:nowrap; }
.pag-pages { display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
.pag-btn {
  min-width:34px; height:34px; border-radius:8px; border:1px solid var(--border);
  background:rgba(255,255,255,.04); color:var(--muted);
  font-size:13px; font-weight:600; cursor:pointer; font-family:"Outfit",sans-serif;
  transition:all .15s; display:flex; align-items:center; justify-content:center;
  padding:0 6px;
}
.pag-btn:hover:not([disabled]) { background:rgba(255,255,255,.09); color:var(--text); border-color:rgba(255,255,255,.22); }
.pag-btn.pag-on { background:rgba(5,229,123,.12); border-color:rgba(5,229,123,.45); color:var(--green); }
.pag-btn[disabled] { opacity:.3; cursor:not-allowed; }
.pag-arrow { font-size:16px; min-width:34px; }
.pag-dots { font-size:13px; color:var(--muted2); padding:0 4px; line-height:34px; }
</style>
</head>
<body>
<div id="app">
  <div id="bg"></div>
  <div id="bg-overlay"></div>

  <!-- ── Topbar ── -->

<script>
// ══════════════════════════════════════════════════════════════
const G     = "#05E57B";
const API   = "https://xbccmcszhnybxzlirjgk.supabase.co/storage/v1/object/public/wallpaper/gallery.json";
const IMGURL = id => `https://xbccmcszhnybxzlirjgk.supabase.co/storage/v1/object/public/wallpaper/${id}.jpg`;
const FAV   = d  => `https://www.google.com/s2/favicons?domain=${d}&sz=64`;

const load  = (k,fb) => { try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch{return fb;} };
const save  = (k,v)  => { try{localStorage.setItem(k,JSON.stringify(v));}catch{} };

// ── APPS ──────────────────────────────────────────────────────
const APPS = [

  {id:7,  n:"Notion",        u:"https://notion.so",             d:"notion.so"},
  {id:8,  n:"Figma",         u:"https://figma.com",             d:"figma.com"},

  {id:24, n:"Stack Overflow",u:"https://stackoverflow.com",     d:"stackoverflow.com"},
  {id:25, n:"Canva",         u:"https://canva.com",             d:"canva.com"},
  {id:26, n:"Trello",        u:"https://trello.com",            d:"trello.com"},
  {id:27, n:"Google",        u:"https://google.com",            d:"google.com"},
  {id:28, n:"Outlook",       u:"https://outlook.live.com",      d:"outlook.live.com"},
  {id:29, n:"Behance",       u:"https://behance.net",           d:"behance.net"},
  {id:30, n:"Dribbble",      u:"https://dribbble.com",          d:"dribbble.com"},
];

// ── COLORS ────────────────────────────────────────────────────
const DARKS = [
  {id:"d1",v:"#060810"},{id:"d2",v:"#0c1211"},{id:"d3",v:"#0D1117"},
  {id:"d4",v:"#1a1a2e"},{id:"d5",v:"#111111"},{id:"d6",v:"#0a0f1e"},
];
const LIGHTS = [
  {id:"l1",v:"#ffffff"},{id:"l2",v:"#f1f5f9"},{id:"l3",v:"#e8f4f8"},
];
const GRADS = [
  {id:"g1",v:"linear-gradient(135deg,#0f0c29,#302b63,#24243e)"},
  {id:"g2",v:"linear-gradient(135deg,#0f2027,#203a43,#2c5364)"},
  {id:"g3",v:"linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)"},
  {id:"g4",v:"linear-gradient(135deg,#4776e6,#8e54e9)"},
  {id:"g5",v:"linear-gradient(135deg,#134e5e,#71b280)"},
  {id:"g6",v:"linear-gradient(135deg,#f09819,#ff512f)"},
  {id:"g7",v:"linear-gradient(135deg,#1a0533,#4a1259,#8b1fcf)"},
  {id:"g8",v:"linear-gradient(135deg,#eecda3,#ef629f)"},
];

// ── STATE ─────────────────────────────────────────────────────
let S = {
  pinned:  load("sx-pinned",  [1,2,3,4,5,6]),
  custom:  load("sx-custom",  []),
  bg:      load("sx-bg4",     {id:"d1",type:"solid",v:"#060810"}),
  panel:   null,
  wps: [], cats: [],
  wf:"both", wcat:"all", wsearch:"", wpPage:0, WP_PER:35,
  dsearch:"",
};

// ── BACKGROUND ────────────────────────────────────────────────
function applyBg() {
  const el  = $("bg"), ov = $("bg-overlay");
  const {type,v} = S.bg;
  el.style.backgroundImage = "";
  el.style.background = "";
  if (type==="wp") {
    el.style.backgroundImage = `url('${v}')`;
    el.style.backgroundSize  = "cover";
    el.style.backgroundPosition = "center";
    ov.style.background = "rgba(0,0,0,.28)";
  } else if (type==="grad") {
    el.style.background = v;
    ov.style.background = "";
  } else {
    el.style.background = v;
    ov.style.background = "";
  }
  save("sx-bg4", S.bg);
}
function setBg(b) { S.bg = b; applyBg(); }

// ── CLOCK ─────────────────────────────────────────────────────
function tick() {
  const d=new Date(), h=d.getHours(), m=d.getMinutes().toString().padStart(2,"0");
  $("t-time").textContent = `${h%12||12}:${m}`;
  $("t-ampm").textContent = h>=12?"PM":"AM";
  $("t-date").textContent = d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
}

// ── PINNED APPS ───────────────────────────────────────────────
function allApps() { return [...APPS,...S.custom]; }
function pinnedApps() { return S.pinned.map(id=>allApps().find(a=>a.id===id)).filter(Boolean); }

function renderPinned() {
  const g = $("apps-grid");
  const apps = pinnedApps();
  if (!apps.length) {
    g.innerHTML = `<div id="apps-empty">Open <kbd>Settings → Manage Apps</kbd> to pin your favorites</div>`;
    return;
  }
  g.innerHTML = apps.map(a=>`
    <div class="app-chip" data-url="${a.u}">
      <div class="app-chip-box">
        ${a.d?`<img src="${FAV(a.d)}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'" alt="">`:""}
        <span class="app-chip-init" style="${a.d?'display:none':''}">${a.n[0]}</span>
        <span class="chip-remove" data-rm="${a.id}">✕</span>
      </div>
      <span class="app-chip-label">${a.n}</span>
    </div>`).join("")
  +`<div class="app-more" id="more-apps">
      <div class="app-more-box">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.38)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <span class="app-more-label">More</span>
    </div>`;
}

// ── DRAWER ────────────────────────────────────────────────────
const pinSVG = on => on
  ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="${G}" stroke="${G}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`
  : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;

const trashSVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>`;

function renderDrawer() {
  const q   = S.dsearch.toLowerCase();
  const all = allApps().filter(a=>!q||a.n.toLowerCase().includes(q));
  $("d-list").innerHTML = !all.length
    ? `<div style="text-align:center;padding:40px 20px;color:rgba(255,255,255,.25);font-size:13px">No apps found</div>`
    : all.map(a=>`
      <div class="d-row">
        <div class="d-icon">
          ${a.d?`<img src="${FAV(a.d)}" onerror="this.style.display='none'" alt="">`:`<span style="font-size:16px;font-weight:700">${a.n[0]}</span>`}
        </div>
        <div class="d-info">
          <a class="d-name" href="${a.u}">${a.n}</a>
          <div class="d-domain">${a.d||""}</div>
        </div>
        <button class="d-pin" data-pin="${a.id}" title="${S.pinned.includes(a.id)?"Unpin":"Pin"}">${pinSVG(S.pinned.includes(a.id))}</button>
        ${a._c?`<button class="d-del" data-del="${a.id}" title="Remove">${trashSVG}</button>`:""}
      </div>`).join("");
}

// ── WALLPAPERS ────────────────────────────────────────────────
async function loadWallpapers() {
  if (S.wps.length) { renderWpGrid(); return; }
  renderShimmer();
  try {
    const cached = sessionStorage.getItem("lumi-g3");
    const data   = cached ? JSON.parse(cached) : await fetch(API).then(r=>r.json());
    if (!cached) sessionStorage.setItem("lumi-g3", JSON.stringify(data));

    S.wps  = [];
    Object.entries(data.themes).forEach(([type,arr])=>{
      arr.forEach(w=>S.wps.push({id:w.id,lbl:w.label,dark:type==="dark",cat:w.categoryId}));
    });
    S.cats = data.categories||[];
    $("wp-count").textContent = S.wps.length;
    renderWpCats();
    renderWpGrid();
  } catch {
    $("wp-grid").innerHTML=`<div class="wp-empty"><span style="font-size:32px">📡</span>Could not load wallpapers — check internet</div>`;
  }
}

function renderShimmer() {
  $("wp-grid").innerHTML = Array(16).fill(0).map(()=>`<div class="wp-card"></div>`).join("");
}

function renderWpCats() {
  $("wp-cats").innerHTML =
    `<button class="wp-cat${S.wcat==="all"?" on":""}" data-c="all">All</button>`
    + S.cats.map(c=>`<button class="wp-cat${S.wcat===c.id?" on":""}" data-c="${c.id}">${c.label}</button>`).join("");
}

function renderWpGrid() {
  const all = S.wps.filter(w=>{
    const byF = S.wf==="both"||(S.wf==="dark"&&w.dark)||(S.wf==="light"&&!w.dark);
    const byC = S.wcat==="all"||w.cat===S.wcat;
    const byS = !S.wsearch||w.lbl.toLowerCase().includes(S.wsearch.toLowerCase());
    return byF&&byC&&byS;
  });

  const total  = all.length;
  const pages  = Math.max(1, Math.ceil(total / S.WP_PER));
  S.wpPage     = Math.min(S.wpPage, pages-1);
  const start  = S.wpPage * S.WP_PER;
  const page   = all.slice(start, start + S.WP_PER);

  if (!total) {
    $("wp-grid").innerHTML = `<div class="wp-empty"><span style="font-size:32px">🔍</span>No wallpapers found</div>`;
    $("wp-pag").innerHTML  = "";
    return;
  }

  const isSel = id => S.bg.id===id;

  $("wp-grid").innerHTML = page.map(w=>`
    <div class="wp-card${isSel(w.id)?" sel":""}" data-wid="${w.id}">
      <img class="wp-img" src="${IMGURL(w.id)}" alt="${w.lbl}" loading="lazy"
           onload="this.classList.add('vis');this.closest('.wp-card').classList.add('loaded')"
           onerror="this.style.display='none'">
      <div class="wp-lbl">${w.lbl}</div>
      <div class="wp-hover"><span class="wp-use">${isSel(w.id)?"✓ Applied":"Use"}</span></div>
      ${isSel(w.id)?`<div class="wp-check">✓</div>`:""}
    </div>`).join("");

  // ── Pagination bar ──
  if (pages <= 1) { $("wp-pag").innerHTML=""; return; }

  const cur   = S.wpPage;
  const delta = 2; // pages around current
  let btns    = [];

  const addPage = p => {
    const active = p===cur;
    btns.push(`<button class="pag-btn${active?" pag-on":""}" data-pg="${p}">${p+1}</button>`);
  };

  // Always show page 1
  addPage(0);
  if (cur - delta > 1) btns.push(`<span class="pag-dots">…</span>`);
  for (let p = Math.max(1, cur-delta); p <= Math.min(pages-2, cur+delta); p++) addPage(p);
  if (cur + delta < pages-2) btns.push(`<span class="pag-dots">…</span>`);
  if (pages > 1) addPage(pages-1);

  $("wp-pag").innerHTML = `
    <div class="pag-info">Showing ${start+1}–${Math.min(start+S.WP_PER,total)} of ${total}</div>
    <div class="pag-pages">
      <button class="pag-btn pag-arrow" data-pg="${cur-1}" ${cur===0?"disabled":""}>‹</button>
      ${btns.join("")}
      <button class="pag-btn pag-arrow" data-pg="${cur+1}" ${cur===pages-1?"disabled":""}>›</button>
    </div>`;
}

// ── COLORS PANEL ──────────────────────────────────────────────
function renderColors() {
  const dot = (c,type) => `
    <div class="c-dot${S.bg.id===c.id?" on":""}"
      data-cid="${c.id}" data-ctype="${type}" data-cval="${c.v}"
      style="background:${c.v};border-color:${S.bg.id===c.id?G:"rgba(255,255,255,.1)"}"></div>`;
  const gsw = g => `
    <div class="g-swatch${S.bg.id===g.id?" on":""}"
      data-gid="${g.id}" data-gval="${g.v}"
      style="background:${g.v};border-color:${S.bg.id===g.id?G:"transparent"}"></div>`;
  $("dark-colors").innerHTML  = DARKS.map(c=>dot(c,"solid")).join("");
  $("light-colors").innerHTML = LIGHTS.map(c=>dot(c,"solid")).join("");
  $("grads").innerHTML = GRADS.map(g=>gsw(g)).join("");
}

// ── PANEL OPEN/CLOSE ──────────────────────────────────────────
function closeAll() {
  S.panel=null;
  $("settings-menu").classList.remove("open");
  $("colors-panel").classList.remove("open");
  $("drawer").classList.remove("open");
  $("wp-panel").classList.remove("open");
  $("overlay").classList.remove("dim");
}
function openPanel(name) {
  closeAll();
  S.panel = name;
  if (name==="settings") { $("settings-menu").classList.add("open"); return; }
  if (name==="colors")   { renderColors(); $("colors-panel").classList.add("open"); return; }
  if (name==="apps")     { renderDrawer(); $("drawer").classList.add("open"); $("overlay").classList.add("dim"); return; }
  if (name==="wp")       { $("wp-panel").classList.add("open"); loadWallpapers(); return; }
}

// ── TOAST ─────────────────────────────────────────────────────
let _tt;
function toast(msg,color=G){
  const el=$("toast"); el.textContent=msg; el.style.color=color; el.style.display="block";
  clearTimeout(_tt); _tt=setTimeout(()=>el.style.display="none",2600);
}

// ── EVENTS ────────────────────────────────────────────────────
function initEvents() {
  // Settings
  $("btn-settings").onclick = e=>{ e.stopPropagation(); S.panel==="settings"?closeAll():openPanel("settings"); };
  $("m-wp").onclick   = ()=>openPanel("wp");
  $("m-col").onclick  = ()=>openPanel("colors");
  $("m-apps").onclick = ()=>openPanel("apps");

  // Close buttons
  $("col-close").onclick  = closeAll;
  $("drawer-close").onclick = closeAll;
  $("wp-close").onclick   = closeAll;
  $("overlay").onclick    = closeAll;

  // Close settings on outside click
  document.addEventListener("click", e=>{
    if (S.panel==="settings" && !e.target.closest("#settings-menu") && !e.target.closest("#btn-settings")) closeAll();
  });

  // Keyboard
  document.addEventListener("keydown", e=>{
    if (e.key==="Escape") closeAll();
    if ((e.ctrlKey||e.metaKey)&&e.key==="k"){ e.preventDefault(); $("search-input").focus(); }
  });

  // Search
  $("search-input").oninput = e=>{
    $("search-btn").className = e.target.value ? "search-btn show" : "search-btn";
  };
  const doSearch = ()=>{
    const q=$("search-input").value.trim();
    if(q){ window.open("https://www.google.com/search?q="+encodeURIComponent(q),"_blank"); $("search-input").value=""; $("search-btn").className="search-btn"; }
  };
  $("search-input").onkeydown = e=>e.key==="Enter"&&doSearch();
  $("search-btn").onclick = doSearch;

  // Pinned apps (delegation)
  $("apps-grid").addEventListener("click",e=>{
    const rm = e.target.closest("[data-rm]");
    if(rm){ e.stopPropagation(); const id=isNaN(rm.dataset.rm)?rm.dataset.rm:+rm.dataset.rm; S.pinned=S.pinned.filter(x=>x!==id); save("sx-pinned",S.pinned); renderPinned(); return; }
    const chip = e.target.closest(".app-chip");
    if(chip){ window.location.href=chip.dataset.url; return; }
    const more = e.target.closest("#more-apps");
    if(more) openPanel("apps");
  });

  // Drawer list (delegation)
  $("d-list").addEventListener("click",e=>{
    const pin = e.target.closest("[data-pin]");
    if(pin){
      const id = isNaN(pin.dataset.pin)?pin.dataset.pin:+pin.dataset.pin;
      S.pinned = S.pinned.includes(id)?S.pinned.filter(x=>x!==id):[...S.pinned,id];
      save("sx-pinned",S.pinned); renderPinned(); renderDrawer(); return;
    }
    const del = e.target.closest("[data-del]");
    if(del){
      const id=del.dataset.del;
      S.custom=S.custom.filter(a=>a.id!==id); S.pinned=S.pinned.filter(x=>x!==id);
      save("sx-custom",S.custom); save("sx-pinned",S.pinned); renderPinned(); renderDrawer();
    }
  });

  // Drawer search
  $("d-search").oninput = e=>{ S.dsearch=e.target.value; renderDrawer(); };

  // Add form
  const dAddBtn=$("d-add-btn"), dForm=$("d-form"), fName=$("f-name"), fUrl=$("f-url"), fAdd=$("f-add");
  if(dAddBtn) dAddBtn.onclick=()=>{ dAddBtn.style.display="none"; dForm.style.display="flex"; fName.focus(); };
  if(dForm)   { const fCan=$("f-cancel"); if(fCan) fCan.onclick=()=>{ dForm.style.display="none"; dAddBtn.style.display="flex"; fName.value=fUrl.value=""; }; }
  if(fAdd)    fAdd.onclick=addApp;
  if(fUrl)    fUrl.onkeydown=e=>e.key==="Enter"&&addApp();

  // WP filters
  $("wp-panel").addEventListener("click",e=>{
    const fb=e.target.closest("[data-f]");
    if(fb){ document.querySelectorAll(".wp-f-btn").forEach(b=>b.classList.remove("on")); fb.classList.add("on"); S.wf=fb.dataset.f; S.wpPage=0; renderWpGrid(); return; }
    const cb=e.target.closest("[data-c]");
    if(cb){ S.wcat=cb.dataset.c; S.wpPage=0; renderWpCats(); renderWpGrid(); return; }
    const wc=e.target.closest("[data-wid]");
    if(wc){
      const wp=S.wps.find(w=>w.id===wc.dataset.wid);
      if(wp){ setBg({id:wp.id,type:"wp",v:IMGURL(wp.id),dark:wp.dark}); toast("Wallpaper applied ✓"); renderWpGrid(); }
      return;
    }
    const pb=e.target.closest("[data-pg]");
    if(pb&&!pb.disabled){
      const pg=+pb.dataset.pg;
      if(pg>=0){ S.wpPage=pg; renderWpGrid(); const sc=$("wp-scroll"); if(sc) sc.scrollTo({top:0,behavior:"smooth"}); }
    }
  });

  // WP search
  $("wp-search").oninput = e=>{ S.wsearch=e.target.value; S.wpPage=0; renderWpGrid(); };

  // Colors panel (delegation)
  $("dark-colors").addEventListener("click",e=>{ const d=e.target.closest("[data-cid]"); if(d){ setBg({id:d.dataset.cid,type:"solid",v:d.dataset.cval}); renderColors(); } });
  $("light-colors").addEventListener("click",e=>{ const d=e.target.closest("[data-cid]"); if(d){ setBg({id:d.dataset.cid,type:"solid",v:d.dataset.cval}); renderColors(); } });
  $("grads").addEventListener("click",e=>{ const g=e.target.closest("[data-gid]"); if(g){ setBg({id:g.dataset.gid,type:"grad",v:g.dataset.gval}); renderColors(); } });
  $("custom-color-input").oninput = e=>{ setBg({id:"custom",type:"solid",v:e.target.value}); };
}

function addApp() {
  const n=$("f-name").value.trim(), raw=$("f-url").value.trim();
  if(!n||!raw) return;
  const url=raw.startsWith("http")?raw:"https://"+raw;
  let d=""; try{d=new URL(url).hostname;}catch{}
  const app={id:"c"+Date.now(),n,u:url,d,_c:true};
  S.custom=[...S.custom,app]; S.pinned=[...S.pinned,app.id];
  save("sx-custom",S.custom); save("sx-pinned",S.pinned);
  $("f-name").value=$("f-url").value="";
  const _f=$("d-form"),_b=$("d-add-btn"); if(_f)_f.style.display="none"; if(_b)_b.style.display="flex";
  renderPinned(); renderDrawer(); toast(`"${n}" added ✓`);
}

// ── INIT ──────────────────────────────────────────────────────
applyBg(); tick(); setInterval(tick,1000); renderPinned(); initEvents();
</script>
</body>
</html>
